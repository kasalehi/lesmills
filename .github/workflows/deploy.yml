name: Deploy to Astronomer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-airflow apache-airflow-providers-microsoft-mssql streamlit

      - name: Validate DAGs
        run: |
          python -m py_compile dags/*.py
          echo "✓ DAG syntax is valid"

  build:
    needs: validate-dags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker buildx build --load -t astro:latest .
          echo "✓ Docker image built successfully"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Astronomer
        run: |
          echo "Preparing deployment to Astronomer Cloud..."
          echo "To enable deployment, add ASTRONOMER_API_TOKEN secret to GitHub"
          echo "Note: You can deploy using the Astronomer CLI with:"
          echo "  astro deploy"
        env:
          ASTRONOMER_API_TOKEN: ${{ secrets.ASTRONOMER_API_TOKEN }}

  streamlit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit

      - name: Check Streamlit app syntax
        run: |
          python -m py_compile include/lesmills_project/streamlit.py
          echo "✓ Streamlit app syntax is valid"
