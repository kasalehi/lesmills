name: Run ML Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install apache-airflow streamlit pandas scikit-learn pyodbc

      - name: Run DAG validation
        run: |
          python -c "from airflow import DAG; import dags.train as dag_module; print('✓ DAG modules loaded successfully')"

      - name: Build and test locally
        run: |
          echo "Pipeline validation complete"
          echo "Note: For full pipeline execution, deploy to Astronomer Cloud"
          echo "To trigger DAG in production:"
          echo "  1. Go to https://cloud.astronomer.io"
          echo "  2. Navigate to your deployment"
          echo "  3. Click on the DAG in Airflow UI"
          echo "  4. Click 'Trigger DAG'"
